apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cosmolet.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cosmolet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cosmolet
    spec:
      serviceAccountName: {{ include "cosmolet.serviceAccountName" . }}
      hostNetwork: {{ .Values.daemonset.hostNetwork }}
      hostPID: {{ .Values.daemonset.hostPID }}
      containers:
      - name: cosmolet
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        # Downward API: identity for leader election (Finding 2) and the
        # coordination.k8s.io Lease namespace.
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        # Finding 19: the binary exposes /healthz (liveness) and /readyz
        # (readiness) on :8080; the Dockerfile HEALTHCHECK is ignored by
        # kubelet, so declare in-pod probes explicitly. With hostNetwork:true
        # these hit the host address on the node.
        {{- with .Values.probes.liveness }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.probes.readiness }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/cosmolet
        - name: frr-sockets
          mountPath: /var/run/frr
      volumes:
      - name: config
        configMap:
          name: {{ include "cosmolet.fullname" . }}-config
      - name: frr-sockets
        hostPath:
          path: /var/run/frr
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
