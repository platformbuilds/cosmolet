{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cosmolet.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cosmolet
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cosmolet.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: cosmolet
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # Discover services and their endpoints across all configured namespaces.
  - apiGroups: [""]
    resources:
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  # Every pod competes for the coordination.k8s.io Lease that gates the
  # leader-election loop (Finding 2). create/get/watch on leases are
  # needed to acquire, renew, and observe the cosmolet-leader lease.
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cosmolet.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: cosmolet
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cosmolet.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cosmolet.serviceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
