# Default values for cosmolet
replicaCount: 1

image:
  # Defaults match `make docker-build` (Makefile DOCKER_REGISTRY/
  # DOCKER_REPOSITORY). The tag defaults to the chart appVersion so the
  # chart and the build share a single version source; override with
  # --set image.tag to pin a specific build.
  registry: docker.io
  repository: cosmolet/cosmolet
  pullPolicy: IfNotPresent
  tag: ""

# Configuration rendered into the cosmolet ConfigMap (config.yaml) in the
# binary's snake_case schema (see pkg/config/config.go). The keys below are
# camelCase in values.yaml for Helm convention but are rendered as snake_case.
config:
  services:
    namespaces:
      - "default"
      - "kube-system"
  loopIntervalSeconds: 30
  bgp:
    enabled: true
    # BGP autonomous system number (1..4294967295). Required and validated
    # when bgp.enabled is true (see Finding 8). Override per deployment.
    asn: 65001
  logging:
    level: "info"
    format: "text"
  frr:
    # Path to the FRR unix socket. Mounts the same /var/run/frr as the pod.
    socketPath: "/var/run/frr"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations:
  - operator: Exists
affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

securityContext:
  privileged: true
  runAsUser: 0

daemonset:
  hostNetwork: true
  hostPID: true
